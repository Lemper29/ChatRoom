syntax = "proto3";

package chatroom;

import "google/api/annotations.proto";

option go_package = "github.com/Lemper29/ChatRoom/gen/go/v1/chatroom";

// Типы сообщений
enum MessageType {
  USER_MESSAGE = 0;
  USER_JOINED = 1;
  USER_LEFT = 2;
  ROOM_CREATED = 3;
  ERROR = 4;
}

// Сообщение чата
message ChatMessage {
  string id = 1;
  MessageType type = 2;
  string room_id = 3;
  string user_id = 4;
  string username = 5;
  string content = 6;
  int64 timestamp = 7;
}

// Создание чата
message CreateChatRequest {
  string room_id = 1;
  string user_id = 2;
  string name = 3;
  string description = 4;
}

message CreateChatResponse {
  string room_id = 1;
  string name = 2;
}

// Опционально: для получения истории сообщений
message MessageHistoryRequest {
  string room_id = 1;
  int32 limit = 2;
}

message MessageHistoryResponse {
  repeated ChatMessage messages = 1;
}

// Сервис
service ChatService {
  // Stream RPC для connect
  rpc Connect(stream ChatMessage) returns (stream ChatMessage);

  // Unary RPC для создания чатов
  rpc CreateChat(CreateChatRequest) returns (CreateChatResponse) {
    option (google.api.http) = {
      post: "/v1/chat"
      body: "*"
    };
  }
  
  // Unary RPC для получения истории сообщений
  rpc GetMessageHistory(MessageHistoryRequest) returns (MessageHistoryResponse) {
    option (google.api.http) = {
      get: "/v1/chat/{room_id}/messages"
    };
  }
}