syntax = "proto3";

package v1;

option go_package = "github.com/Lemper29/ChatRoom/gen";

// Типы сообщений
enum MessageType {
  USER_MESSAGE = 0;
  USER_JOINED = 1;
  USER_LEFT = 2;
  ROOM_CREATED = 3;
  ERROR = 4;
}

// Сообщение чата
message ChatMessage {
  string id = 1;
  MessageType type = 2;
  string room_id = 3;
  string user_id = 4;
  string username = 5;
  string content = 6;
  int64 timestamp = 7;
}

// Инфа о пользователе
message User {
    string id = 1;
    string username = 2;
}

// Сообщение для установления соединения
message ConnectRequest {
  string user_id = 1;
  string username = 2;
  string room_id = 3;
}

// Сервис
service ChatService {
  rpc Connect(stream ChatMessage) returns (stream ChatMessage);
  
  // Unary RPC для получения истории сообщений (опционально)
  rpc GetMessageHistory(MessageHistoryRequest) returns (MessageHistoryResponse);
}

// Опционально: для получения истории сообщений
message MessageHistoryRequest {
  string room_id = 1;
  int32 limit = 2;
}

message MessageHistoryResponse {
  repeated ChatMessage messages = 1;
}